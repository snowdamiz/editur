[package]
name = "editur"
version = "0.1.0"
edition = "2024"
description = "A small native editor for quick, focused file changes"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
agent-client-protocol = { version = "=2.0.0", features = ["unstable_auth_methods", "unstable_elicitation"] }
async-channel = "2.5.0"
async-io = "2.6.0"
directories = "6.0.0"
arboard = { version = "3.6.1", default-features = false }
base64 = "0.22.1"
bincode = "1.3.3"
bytemuck = "1.25.0"
egui = { version = "0.35.0", default-features = false, features = ["bytemuck", "default_fonts"] }
egui-winit = { version = "0.35.0", default-features = false, features = ["accesskit"] }
flate2 = "1.1.9"
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lsp-types = "=0.97.0"
pulldown-cmark = { version = "=0.13.4", default-features = false }
regex = "1.13.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
portable-pty = "0.9.0"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.142"
sha2 = "0.11.0"
syntect = { version = "5.3.0", default-features = false, features = ["dump-load", "parsing", "regex-fancy"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
vt100 = "0.16.2"
ureq = { version = "3.3.0", default-features = false, features = ["gzip", "multipart", "rustls"], optional = true }
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[features]
default = ["network"]
network = ["dep:ureq"]

[[example]]
name = "build_agent_manifest"
required-features = ["network"]

[build-dependencies]
naga = { version = "29.0.4", features = ["spv-out", "wgsl-in"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "dump-create", "dump-load", "parsing", "regex-fancy", "yaml-load"] }
winresource = "0.1.31"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
ash = { version = "0.38.0" }
ash-window = { version = "0.13.0" }
egui-winit = { version = "0.35.0", default-features = false, features = ["wayland", "x11"] }
winit = { version = "0.30.13", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics-types = "0.2.0"
metal = "0.33.0"
objc = "0.2.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

[profile.dev]
opt-level = 2

[patch.crates-io]
agent-client-protocol = { path = "vendor/agent-client-protocol" }
block = { path = "vendor/block" }
