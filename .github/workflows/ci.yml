name: CI and release artifacts

on:
  push:
    branches: [main, release]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: editur-linux-x86_64
            archive: dist/editur-linux-x86_64.tar.gz
            update_asset: editur-linux-x86_64
            agent_os: linux
            agent_arch: x86_64
          - os: macos-latest
            artifact: editur-macos-aarch64
            archive: dist/editur-macos-aarch64.zip
            update_asset: editur-macos-aarch64
            agent_os: macos
            agent_arch: aarch64
          - os: macos-15-intel
            artifact: editur-macos-x86_64
            archive: dist/editur-macos-x86_64.zip
            update_asset: editur-macos-x86_64
            agent_os: macos
            agent_arch: x86_64
          - os: windows-latest
            artifact: editur-windows-x86_64
            archive: dist/editur-windows-x86_64.zip
            update_asset: editur-windows-x86_64.exe
            agent_os: windows
            agent_arch: x86_64
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned Codex ACP adapter
        uses: actions/checkout@v6
        with:
          repository: agentclientprotocol/codex-acp
          ref: 5faefec5d55ded33c54b68ffec93def4f6c547f5
          path: provider-src/codex
          persist-credentials: false
      - name: Install pinned private provider runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: provider-src/codex/package-lock.json
      - name: Install stable Rust
        run: rustup update stable --no-self-update
      - name: Validate Unix bootstrap installer
        if: runner.os != 'Windows'
        run: sh -n install.sh dev.sh
      - name: Validate Windows bootstrap installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: $null = [scriptblock]::Create((Get-Content -LiteralPath install.ps1 -Raw))
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Install Apple Metal compiler
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build pinned Codex ACP package
        working-directory: provider-src/codex
        run: |
          npm ci --ignore-scripts
          npm run build
          npm prune --omit=dev --ignore-scripts
      - name: Verify exact Codex source, lock, dependency, and Node pins
        run: cargo run --locked --example verify_codex_source -- provider-src/codex
      - name: Fetch and verify private Node runtime on Unix
        if: runner.os != 'Windows'
        run: |
          case "${{ matrix.agent_os }}-${{ matrix.agent_arch }}" in
            linux-x86_64)
              node_archive=node-v22.22.0-linux-x64.tar.gz
              node_sha=c33c39ed9c80deddde77c960d00119918b9e352426fd604ba41638d6526a4744
              ;;
            macos-aarch64)
              node_archive=node-v22.22.0-darwin-arm64.tar.gz
              node_sha=5ed4db0fcf1eaf84d91ad12462631d73bf4576c1377e192d222e48026a902640
              ;;
            macos-x86_64)
              node_archive=node-v22.22.0-darwin-x64.tar.gz
              node_sha=5ea50c9d6dea3dfa3abb66b2656f7a4e1c8cef23432b558d45fb538c7b5dedce
              ;;
            *) exit 1 ;;
          esac
          mkdir -p dist
          curl --fail --silent --show-error --location \
            "https://nodejs.org/dist/v22.22.0/$node_archive" \
            --output dist/node-runtime.tar.gz
          if [ "$RUNNER_OS" = "macOS" ]; then
            actual_sha="$(shasum -a 256 dist/node-runtime.tar.gz | awk '{print $1}')"
          else
            actual_sha="$(sha256sum dist/node-runtime.tar.gz | awk '{print $1}')"
          fi
          test "$actual_sha" = "$node_sha"
          mkdir -p dist/node-runtime
          tar -xzf dist/node-runtime.tar.gz -C dist/node-runtime --strip-components=1
      - name: Fetch and verify private Node runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $archive = Join-Path $env:GITHUB_WORKSPACE 'dist/node-runtime.zip'
          Invoke-WebRequest 'https://nodejs.org/dist/v22.22.0/node-v22.22.0-win-x64.zip' -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'c97fa376d2becdc8863fcd3ca2dd9a83a9f3468ee7ccf7a6d076ec66a645c77a'
          if ($actual -ne $expected) { throw 'private Node runtime checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath dist/node-runtime
      - name: Stage Codex provider runtime on Unix
        if: runner.os != 'Windows'
        run: |
          stage="$GITHUB_WORKSPACE/dist/codex-stage"
          mkdir -p "$stage/package/dist" "$stage/package/node_modules" "$stage/runtime/bin"
          cp provider-src/codex/dist/index.js "$stage/package/dist/index.js"
          cp provider-src/codex/package.json provider-src/codex/README.md provider-src/codex/LICENSE "$stage/package/"
          cp -R provider-src/codex/node_modules/@openai "$stage/package/node_modules/"
          cp dist/node-runtime/bin/node "$stage/runtime/bin/node"
          cp dist/node-runtime/LICENSE "$stage/runtime/LICENSE"
      - name: Stage Codex provider runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist/codex-stage'
          New-Item -ItemType Directory -Force (Join-Path $stage 'package/dist'), (Join-Path $stage 'package/node_modules'), (Join-Path $stage 'runtime') | Out-Null
          Copy-Item provider-src/codex/dist/index.js -Destination (Join-Path $stage 'package/dist/index.js')
          Copy-Item provider-src/codex/package.json, provider-src/codex/README.md, provider-src/codex/LICENSE -Destination (Join-Path $stage 'package')
          Copy-Item provider-src/codex/node_modules/@openai -Destination (Join-Path $stage 'package/node_modules/@openai') -Recurse
          $nodeRoot = Join-Path $env:GITHUB_WORKSPACE 'dist/node-runtime/node-v22.22.0-win-x64'
          Copy-Item (Join-Path $nodeRoot 'node.exe') -Destination (Join-Path $stage 'runtime/node.exe')
          Copy-Item (Join-Path $nodeRoot 'LICENSE') -Destination (Join-Path $stage 'runtime/LICENSE')
      - name: Package deterministic Codex provider runtime
        run: >-
          cargo run --locked --example package_provider_runtime --
          dist/codex-stage
          dist/editur-provider-codex-${{ matrix.agent_os }}-${{ matrix.agent_arch }}.zip
      - name: Reproduce Codex provider runtime
        run: >-
          cargo run --locked --example package_provider_runtime --
          dist/codex-stage
          dist/editur-provider-codex-${{ matrix.agent_os }}-${{ matrix.agent_arch }}.reproduced.zip
      - name: Verify deterministic Codex archive
        run: >-
          git diff --no-index --quiet --
          dist/editur-provider-codex-${{ matrix.agent_os }}-${{ matrix.agent_arch }}.zip
          dist/editur-provider-codex-${{ matrix.agent_os }}-${{ matrix.agent_arch }}.reproduced.zip
      - name: Generate pinned provider manifests
        run: >-
          cargo run --locked --example build_agent_manifest --
          assets/agent/cursor-release.json
          ${{ matrix.agent_os }}
          ${{ matrix.agent_arch }}
          dist/${{ matrix.update_asset }}.cursor.json
      - run: >-
          cargo run --locked --example build_agent_manifest --
          assets/agent/codex-release.json
          ${{ matrix.agent_os }}
          ${{ matrix.agent_arch }}
          dist/${{ matrix.update_asset }}.codex.json
          dist/editur-provider-codex-${{ matrix.agent_os }}-${{ matrix.agent_arch }}.zip
      - name: Assemble provider bundle
        run: >-
          cargo run --locked --example build_provider_bundle --
          dist/${{ matrix.update_asset }}.agent.json
          dist/${{ matrix.update_asset }}.cursor.json
          dist/${{ matrix.update_asset }}.codex.json
      - name: Assemble Cursor-only rollback bundle
        run: >-
          cargo run --locked --example build_provider_bundle --
          dist/${{ matrix.update_asset }}.cursor-only.agent.json
          dist/${{ matrix.update_asset }}.cursor.json
      - name: Build Cursor-only rollback candidate
        env:
          EDITUR_PROVIDER_BUNDLE: dist/${{ matrix.update_asset }}.cursor-only.agent.json
          EDITUR_UPDATE_BASE: https://github.com/${{ github.repository }}/releases/download/release
          EDITUR_REQUIRE_PRECOMPILED_METAL: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: cargo build --release --locked
      - name: Verify packaged Codex version and launch
        run: >-
          cargo run --locked --example verify_provider_package --
          dist/${{ matrix.update_asset }}.codex.json
          dist/editur-provider-codex-${{ matrix.agent_os }}-${{ matrix.agent_arch }}.zip
      - name: Build release binary
        env:
          EDITUR_PROVIDER_BUNDLE: dist/${{ matrix.update_asset }}.agent.json
          EDITUR_UPDATE_BASE: https://github.com/${{ github.repository }}/releases/download/release
          EDITUR_REQUIRE_PRECOMPILED_METAL: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: cargo build --release --locked
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/package
          if [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p dist/package/Editur.app/Contents/MacOS dist/package/Editur.app/Contents/Resources
            cp target/release/editur dist/package/Editur.app/Contents/MacOS/
            cp assets/macos/Info.plist dist/package/Editur.app/Contents/
            cp assets/icons/editur.icns dist/package/Editur.app/Contents/Resources/Editur.icns
            /usr/bin/ditto -c -k --keepParent dist/package/Editur.app "${{ matrix.archive }}"
          else
            cp target/release/editur dist/package/
            cp assets/icons/editur.png dist/package/
            tar -C dist/package -czf "${{ matrix.archive }}" .
          fi
          cp target/release/editur "dist/${{ matrix.update_asset }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 "dist/${{ matrix.update_asset }}" | awk '{print $1}' > "dist/${{ matrix.update_asset }}.sha256"
            shasum -a 256 "${{ matrix.archive }}" | awk '{print $1}' > "${{ matrix.archive }}.sha256"
          else
            sha256sum "dist/${{ matrix.update_asset }}" | awk '{print $1}' > "dist/${{ matrix.update_asset }}.sha256"
            sha256sum "${{ matrix.archive }}" | awk '{print $1}' > "${{ matrix.archive }}.sha256"
          fi
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item target/release/editur.exe, assets/icons/editur.ico -Destination dist/package
          Compress-Archive -Path dist/package/* -DestinationPath "${{ matrix.archive }}"
          Copy-Item target/release/editur.exe "dist/${{ matrix.update_asset }}"
          $hash = (Get-FileHash "dist/${{ matrix.update_asset }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "dist/${{ matrix.update_asset }}.sha256" -Value $hash -NoNewline
          $archiveHash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "${{ matrix.archive }}.sha256" -Value $archiveHash -NoNewline
          if ((Get-Content -LiteralPath "dist/${{ matrix.update_asset }}.sha256" -Raw) -ne $hash) {
            throw "Windows updater checksum was not written correctly"
          }
      - name: Verify native application package
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -x dist/package/Editur.app/Contents/MacOS/editur
            test -s dist/package/Editur.app/Contents/Resources/Editur.icns
            plutil -lint dist/package/Editur.app/Contents/Info.plist
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' dist/package/Editur.app/Contents/Info.plist)" = editur
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/package/Editur.app/Contents/Info.plist)" = Editur
          else
            test -x dist/package/editur
            test -s dist/package/editur.png
          fi
      - name: Verify Windows application package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath dist/package/editur.exe -PathType Leaf)) {
            throw 'Windows package is missing editur.exe'
          }
          if (-not (Test-Path -LiteralPath dist/package/editur.ico -PathType Leaf)) {
            throw 'Windows package is missing the Editur icon'
          }
          $signature = [IO.File]::ReadAllBytes((Resolve-Path dist/package/editur.exe))[0..1]
          if ($signature[0] -ne 0x4d -or $signature[1] -ne 0x5a) {
            throw 'editur.exe is not a Windows PE executable'
          }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            dist/${{ matrix.update_asset }}
            dist/${{ matrix.update_asset }}.sha256
            dist/${{ matrix.update_asset }}.agent.json
            dist/editur-provider-codex-${{ matrix.agent_os }}-${{ matrix.agent_arch }}.zip
          if-no-files-found: error
      - name: Sign build provenance
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            dist/${{ matrix.update_asset }}
            dist/${{ matrix.update_asset }}.sha256
            dist/${{ matrix.update_asset }}.agent.json
            dist/editur-provider-codex-${{ matrix.agent_os }}-${{ matrix.agent_arch }}.zip
  release-gate:
    name: Stable Codex smoke gate
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require the recorded native smoke matrix for stable tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify_codex_smoke.mjs "release/codex-smoke/${{ github.ref_name }}.json"

  publish:
    name: Publish releases
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
    needs: [native, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish releases
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const files = fs.readdirSync('dist', { recursive: true })
              .map(file => path.join('dist', file))
              .filter(file => fs.statSync(file).isFile());

            async function publish(tag, name, selected, notes, prerelease = false, moveTag = false) {
              if (selected.length === 0) throw new Error(`No assets found for ${tag}`);
              let release;
              try {
                release = (await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner, repo: context.repo.repo, tag,
                })).data;
              } catch (error) {
                if (error.status !== 404) throw error;
                release = (await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  target_commitish: context.sha,
                  name,
                  body: notes,
                  prerelease,
                })).data;
              }
              if (moveTag) {
                await github.rest.git.updateRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tag}`,
                  sha: context.sha,
                  force: true,
                });
              }
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name,
                body: notes,
                prerelease,
              });
              const existing = (await github.paginate(
                github.rest.repos.listReleaseAssets,
                { owner: context.repo.owner, repo: context.repo.repo, release_id: release.id },
              ));
              for (const file of selected) {
                const asset = existing.find(item => item.name === path.basename(file));
                if (asset) {
                  await github.rest.repos.deleteReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id,
                  });
                }
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  name: path.basename(file),
                  data: fs.readFileSync(file),
                });
              }
            }

            await publish(
              'provider-v1',
              'Editur Codex provider v1',
              files.filter(file => /^editur-provider-codex-(linux|macos|windows)-.+\.zip$/.test(path.basename(file))),
              'Pinned private Codex ACP runtimes. Verify provenance with GitHub artifact attestations.',
              false,
              true,
            );

            if (context.ref === 'refs/heads/release') {
              await publish(
                'release',
                'Editur continuous release',
                files.filter(file => /^editur-(linux|macos|windows)/.test(path.basename(file))),
                `Latest native builds from the release branch (${context.sha}).`,
                true,
                true,
              );
            } else {
              await publish(
                context.ref.replace('refs/tags/', ''),
                `Editur ${context.ref.replace('refs/tags/', '')}`,
                files.filter(file => /^editur-(linux|macos|windows)/.test(path.basename(file))),
                'Native Editur archives. Verify provenance with GitHub artifact attestations.',
              );
            }
            await publish(
              'provider-v1',
              'Editur ACP provider packages v1',
              files.filter(file => /^editur-provider-/.test(path.basename(file))),
              'Pinned private provider packages used by Editur. Verify provenance with GitHub artifact attestations.',
            );

  verify-release:
    name: Verify ${{ matrix.platform }} bootstrap
    if: github.ref == 'refs/heads/release'
    needs: publish
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Unix
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install and update on Unix
        if: runner.os != 'Windows'
        run: |
          install_dir="$RUNNER_TEMP/editur/bin"
          app_dir="$RUNNER_TEMP/editur/apps"
          EDITUR_INSTALL_DIR="$install_dir" EDITUR_APP_DIR="$app_dir" sh install.sh
          "$install_dir/editur" --version
          "$install_dir/editur" --help
          "$install_dir/editur" update
          if [ "$RUNNER_OS" = "macOS" ]; then
            bare_dir="$RUNNER_TEMP/editur/bare-bin"
            mkdir -p "$bare_dir"
            test -f "$app_dir/Editur.app/Contents/Resources/Editur.icns"
            cp "$app_dir/Editur.app/Contents/MacOS/editur" "$bare_dir/editur"
            "$bare_dir/editur" update
            test -L "$bare_dir/editur"
            test -f "$bare_dir/Editur.app/Contents/Resources/Editur.icns"
            "$bare_dir/editur" --version
          fi
      - name: Install and update on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'editur\bin'
          $startMenuDir = Join-Path $env:RUNNER_TEMP 'editur\start-menu'
          .\install.ps1 -InstallDir $installDir -StartMenuDir $startMenuDir
          if (-not (Test-Path -LiteralPath (Join-Path $startMenuDir 'Editur.lnk') -PathType Leaf)) {
            throw 'Windows installer did not create the Editur Start menu shortcut'
          }
          $editur = Join-Path $installDir 'editur.exe'
          & $editur --version
          & $editur --help
          & $editur update
